<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Traffic Signal System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>🚦 Traffic Signal System</h1>

  <div class="box">
    <div id="red" class="light red"></div>
    <div id="yellow" class="light yellow"></div>
    <div id="green" class="light green"></div>
  </div>

  <h2 id="status">RED</h2>
  <h3 id="timer">Time Left: 5s</h3>

  <div class="buttons">
    <button onclick="setLight('red')">Red</button>
    <button onclick="setLight('yellow')">Yellow</button>
    <button onclick="setLight('green')">Green</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
