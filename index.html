<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Railway System</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #0a0a0a, #000);
  overflow: hidden;
  perspective: 1200px;
  font-family: sans-serif;
}

/* SCENE */
.scene {
  width: 100%;
  height: 100vh;
  transform: rotateX(65deg);
  position: relative;
}

/* TRACK */
.track {
  position: absolute;
  width: 300%;
  height: 12px;
  background: #555;
  top: 50%;
  left: -100%;
  box-shadow: 0 0 20px black;
}

/* TRAIN */
.train {
  position: absolute;
  width: 160px;
  height: 45px;
  border-radius: 6px;
  top: calc(50% - 22px);
  left: -200px;
  box-shadow: 0 0 25px;
}

.train1 { background: #ff3b3b; box-shadow: 0 0 30px red; }
.train2 { background: #2979ff; top: calc(50% + 70px); }
.train3 { background: #00e676; top: calc(50% - 100px); }

/* ROAD */
.road {
  position: absolute;
  width: 100%;
  height: 120px;
  background: #222;
  bottom: 0;
}

/* CAR */
.car {
  position: absolute;
  width: 60px;
  height: 30px;
  background: yellow;
  bottom: 40px;
  left: -80px;
  border-radius: 5px;
  box-shadow: 0 0 10px yellow;
}

/* SIGNAL */
.signal {
  position: absolute;
  right: 120px;
  top: 30%;
  background: #111;
  padding: 10px;
  border-radius: 10px;
}

.light {
  width: 40px;
  height: 40px;
  margin: 10px auto;
  border-radius: 50%;
  background: #333;
}

.red.active { background: red; box-shadow: 0 0 20px red; }
.green.active { background: lime; box-shadow: 0 0 20px lime; }

/* GATE */
.gate {
  position: absolute;
  width: 220px;
  height: 10px;
  background: white;
  top: 60%;
  right: 180px;
  transform-origin: left;
  transition: 0.8s ease;
}

.up { transform: rotate(-75deg); }
.down { transform: rotate(0deg); }

</style>
</head>

<body>

<div class="scene">

  <div class="track"></div>

  <div id="t1" class="train train1"></div>
  <div id="t2" class="train train2"></div>
  <div id="t3" class="train train3"></div>

  <div class="signal">
    <div id="red" class="light red"></div>
    <div id="green" class="light green"></div>
  </div>

  <div id="gate" class="gate up"></div>

  <div class="road">
    <div id="car" class="car"></div>
  </div>

</div>

<script>

const trains = [
  document.getElementById("t1"),
  document.getElementById("t2"),
  document.getElementById("t3")
];

const red = document.getElementById("red");
const green = document.getElementById("green");
const gate = document.getElementById("gate");
const car = document.getElementById("car");

let index = 0;

/* SIGNAL */
function setSignal(trainComing) {
  red.classList.remove("active");
  green.classList.remove("active");

  if (trainComing) {
    red.classList.add("active");
    gate.classList.add("down");
    gate.classList.remove("up");
  } else {
    green.classList.add("active");
    gate.classList.add("up");
    gate.classList.remove("down");
  }
}

/* TRAIN MOVE */
function moveTrain(train) {
  train.style.transition = "left 6s linear";
  train.style.left = "120%";

  setTimeout(() => {
    train.style.transition = "none";
    train.style.left = "-200px";
  }, 6000);
}

/* CAR CONTROL */
function moveCar(allow) {
  if (allow) {
    car.style.transition = "left 4s linear";
    car.style.left = "110%";

    setTimeout(() => {
      car.style.transition = "none";
      car.style.left = "-80px";
    }, 4000);
  } else {
    car.style.left = "-80px";
  }
}

/* MAIN LOOP */
function run() {

  if (index >= trains.length) index = 0;

  setSignal(true);
  moveCar(false);

  setTimeout(() => {
    moveTrain(trains[index]);
  }, 1000);

  setTimeout(() => {
    setSignal(false);
    moveCar(true);
  }, 7000);

  index++;

  setTimeout(run, 10000);
}

run();

</script>

</body>
</html>
