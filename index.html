<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Candle</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
}

.candle{
  position:relative;
  width:70px;
  height:200px;
  background:#eee;
  border-radius:12px;
  overflow:hidden;
}

.wax{
  position:absolute;
  bottom:0;
  width:100%;
  height:100%;
  background:#fff;
  transition:height 1s linear;
}

.wick{
  position:absolute;
  top:-15px;
  left:50%;
  width:4px;
  height:15px;
  background:black;
  transform:translateX(-50%);
}

.flame{
  position:absolute;
  top:-60px;
  left:50%;
  width:25px;
  height:45px;
  background:radial-gradient(circle, #fff, yellow, orange);
  border-radius:50%;
  transform:translateX(-50%);
  animation:flicker 0.15s infinite;
}

@keyframes flicker{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.15);}
  100%{transform:translateX(-50%) scale(1);}
}

button{
  position:fixed;
  bottom:20px;
  padding:10px 20px;
}
</style>
</head>

<body>

<div class="candle">
  <div class="wax" id="wax"></div>
  <div class="wick"></div>
  <div class="flame" id="flame"></div>
</div>

<button onclick="start()">Start 🔥</button>

<script>
let total = 600; // 10 mins
let t = total;

const wax = document.getElementById("wax");
const flame = document.getElementById("flame");

function start(){
  melt();
}

function melt(){
  if(t <= 0){
    flame.style.display = "none";
    return;
  }

  t--;

  let percent = t / total;
  wax.style.height = (percent * 100) + "%";

  // flame size reduce slowly
  flame.style.transform = `translateX(-50%) scale(${0.8 + percent*0.4})`;

  setTimeout(melt,1000);
}
</script>

</body>
</html>
