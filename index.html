<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loop Train System</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:linear-gradient(#0f2027,#000);
}
  
/* TRACK PATH (rectangle) */
.track {
  position:absolute;
  width:90%;
  height:90%;
  top:10%;
  left:10%;
  border:6px solid #555;
  box-sizing:border-box;
}

/* TRAIN */
.train {
  position:absolute;
  width:10px;
  height:40px;
  background:red;
  border-radius:2px;
  box-shadow:0 0 15px red;
}

/* SIGNAL */
.signal {
  position:absolute;
  top:10%;
  left:10%;
}

.light {
  width:30px;
  height:30px;
  border-radius:50%;
  margin:5px;
  background:#333;
}

.red.active { background:red; box-shadow:0 0 15px red; }
.green.active { background:lime; box-shadow:0 0 15px lime; }

</style>
</head>

<body>

<div class="track"></div>

<div id="train" class="train"></div>

<div class="signal">
  <div id="red" class="light red"></div>
  <div id="green" class="light green"></div>
</div>

<script>

const train = document.getElementById("train");
const red = document.getElementById("red");
const green = document.getElementById("green");

let path = [
  { x: 10, y: 20 }, // top-left
  { x: 80, y: 20 }, // top-right
  { x: 80, y: 70 }, // bottom-right
  { x: 10, y: 70 }  // bottom-left
];

let i = 0;
let speed = 1000;

function setSignal(stop){
  red.classList.toggle("active", stop);
  green.classList.toggle("active", !stop);
}

function moveTrain(){
  let point = path[i];

  setSignal(true); // red while moving

  train.style.transition = "all 2s linear";
  train.style.left = point.x + "%";
  train.style.top = point.y + "%";

  setTimeout(() => {
    setSignal(false); // green at stop
  }, 1500);

  i = (i + 1) % path.length;

  setTimeout(moveTrain, speed);
}

moveTrain();

</script>

</body>
</html>
