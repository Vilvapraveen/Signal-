<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic Melting Candle</title>
<style>
  body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at center, #222, #000);
    overflow:hidden;
  }

  .candle {
    position:relative;
    width:60px;
    height:180px;
    background:linear-gradient(#fff,#eee);
    border-radius:12px;
    overflow:hidden;
  }

  .wax {
    position:absolute;
    bottom:0;
    width:100%;
    height:100%;
    background:linear-gradient(#fff,#ddd);
    transition:height 1s linear;
  }

  .drip {
    position:absolute;
    width:10px;
    height:20px;
    background:#eee;
    border-radius:50%;
    opacity:0.9;
    animation: drip 3s infinite ease-in;
  }

  @keyframes drip {
    0% { transform: translateY(0); opacity:1; }
    100% { transform: translateY(120px); opacity:0; }
  }

  .wick {
    position:absolute;
    top:-20px;
    left:50%;
    width:4px;
    height:20px;
    background:black;
    transform:translateX(-50%);
  }

  .flame {
    position:absolute;
    top:-65px;
    left:50%;
    width:25px;
    height:50px;
    background:radial-gradient(circle, #fff 10%, yellow 40%, orange 70%, transparent 80%);
    border-radius:50%;
    transform:translateX(-50%);
    animation:flicker 0.15s infinite;
    filter:blur(0.5px);
  }

  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.1); }
    100% { transform: translateX(-50%) scale(1); }
  }

  .glow {
    position:absolute;
    top:-80px;
    left:50%;
    width:80px;
    height:80px;
    background:radial-gradient(circle, rgba(255,200,0,0.4), transparent 70%);
    transform:translateX(-50%);
    filter:blur(10px);
  }

</style>
</head>
<body>

<div class="candle">
  <div class="wax" id="wax"></div>
  <div class="wick"></div>
  <div class="glow"></div>
  <div class="flame" id="flame"></div>
</div>

<script>
const wax = document.getElementById("wax");
const flame = document.getElementById("flame");

let totalTime = 600; // 10 minutes (600 seconds)
let current = totalTime;

function meltCandle(){
  if(current <= 0){
    flame.style.display = "none";
    return;
  }

  current--;

  let heightPercent = (current / totalTime) * 100;
  wax.style.height = heightPercent + "%";

  createDrip();

  requestAnimationFrame(()=>{
    setTimeout(meltCandle,1000);
  });
}

function createDrip(){
  const drip = document.createElement("div");
  drip.className = "drip";

  drip.style.left = Math.random()*50 + "%";
  drip.style.top = "20px";

  document.querySelector(".candle").appendChild(drip);

  setTimeout(()=>{
    drip.remove();
  },3000);
}

// Gravity tilt (mobile)
window.addEventListener('devicemotion', (event)=>{
  const x = event.accelerationIncludingGravity.x;
  flame.style.transform = `translateX(-50%) rotate(${x*4}deg)`;
});

meltCandle();
</script>

</body>
</html>
