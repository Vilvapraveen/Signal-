<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOD LEVEL RAILWAY</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  perspective:1200px;
}

/* CAMERA */
.scene {
  width:100%;
  height:100vh;
  transform:rotateX(65deg);
  animation: cameraMove 20s infinite alternate ease-in-out;
}

@keyframes cameraMove {
  0% { transform: rotateX(65deg) translateX(-20px); }
  100% { transform: rotateX(65deg) translateX(20px); }
}

/* TRACK */
.track {
  position:absolute;
  width:300%;
  height:12px;
  background:#555;
  top:50%;
  left:-100%;
}

/* TRAIN */
.train {
  position:absolute;
  width:180px;
  height:50px;
  border-radius:6px;
  top:50%;
  left:-250px;
}

.t1 { background:red; }
.t2 { background:blue; top:60%; }
.t3 { background:lime; top:40%; }

/* ROAD */
.road {
  position:absolute;
  bottom:0;
  width:100%;
  height:120px;
  background:#222;
}

/* CAR */
.car {
  position:absolute;
  width:60px;
  height:30px;
  background:yellow;
  bottom:40px;
  left:-80px;
}

/* SIGNAL */
.signal {
  position:absolute;
  right:120px;
  top:30%;
}

.light {
  width:40px;
  height:40px;
  border-radius:50%;
  margin:10px;
  background:#333;
}

.red.active { background:red; box-shadow:0 0 20px red; }
.green.active { background:lime; box-shadow:0 0 20px lime; }

/* GATE */
.gate {
  position:absolute;
  width:220px;
  height:10px;
  background:white;
  top:60%;
  right:180px;
  transform-origin:left;
  transition:1s;
}
.up { transform:rotate(-75deg); }
.down { transform:rotate(0deg); }

/* RAIN */
.rain {
  position:absolute;
  width:2px;
  height:15px;
  background:rgba(255,255,255,0.3);
  animation: rainFall linear infinite;
}

@keyframes rainFall {
  from { transform: translateY(-100vh); }
  to { transform: translateY(100vh); }
}

/* FOG */
.fog {
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle, transparent, rgba(0,0,0,0.7));
  pointer-events:none;
}

</style>
</head>

<body>

<div class="scene">

  <div class="track"></div>

  <div id="t1" class="train t1"></div>
  <div id="t2" class="train t2"></div>
  <div id="t3" class="train t3"></div>

  <div class="signal">
    <div id="red" class="light red"></div>
    <div id="green" class="light green"></div>
  </div>

  <div id="gate" class="gate up"></div>

  <div class="road">
    <div id="car" class="car"></div>
  </div>

  <div class="fog"></div>

</div>

<script>

/* SOUND */
const horn = new Audio("https://www.soundjay.com/train/sounds/train-horn-01.mp3");

/* ELEMENTS */
const trains = [
  document.getElementById("t1"),
  document.getElementById("t2"),
  document.getElementById("t3")
];

const red = document.getElementById("red");
const green = document.getElementById("green");
const gate = document.getElementById("gate");
const car = document.getElementById("car");

/* RAIN GENERATOR */
for (let i = 0; i < 100; i++) {
  const drop = document.createElement("div");
  drop.className = "rain";
  drop.style.left = Math.random()*100 + "%";
  drop.style.animationDuration = (Math.random()*1+0.5) + "s";
  document.body.appendChild(drop);
}

/* SIGNAL */
function setSignal(trainComing) {
  red.classList.remove("active");
  green.classList.remove("active");

  if (trainComing) {
    red.classList.add("active");
    gate.classList.add("down");
    gate.classList.remove("up");
  } else {
    green.classList.add("active");
    gate.classList.add("up");
    gate.classList.remove("down");
  }
}

/* TRAIN */
function moveTrain(train) {
  horn.play();

  train.style.transition = "left 6s linear";
  train.style.left = "120%";

  setTimeout(() => {
    train.style.transition = "none";
    train.style.left = "-250px";
  }, 6000);
}

/* CAR */
function moveCar(go) {
  if (go) {
    car.style.transition = "left 4s linear";
    car.style.left = "110%";

    setTimeout(() => {
      car.style.transition = "none";
      car.style.left = "-80px";
    }, 4000);
  }
}

/* AI SYSTEM */
function loop() {
  const randomTrain = trains[Math.floor(Math.random()*trains.length)];

  setSignal(true);
  moveCar(false);

  setTimeout(() => {
    moveTrain(randomTrain);
  }, 1000);

  setTimeout(() => {
    setSignal(false);
    moveCar(true);
  }, 7000);

  setTimeout(loop, 10000 + Math.random()*3000);
}

loop();

</script>

</body>
</html>
