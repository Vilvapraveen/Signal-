<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fire Border</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let particles = [];

// 🔥 PARTICLE
class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = Math.random() * 6 + 2;
    this.speedY = Math.random() * -2 - 1;
    this.speedX = (Math.random() - 0.5) * 2;
    this.life = 100;
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.life--;
    this.size *= 0.96;
  }

  draw() {
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 🔥 CREATE BORDER FIRE
function createBorderFire() {
  let w = canvas.width;
  let h = canvas.height;

  for (let i = 0; i < 5; i++) {

    // TOP
    particles.push(new Particle(Math.random() * w, 0));

    // BOTTOM
    particles.push(new Particle(Math.random() * w, h));

    // LEFT
    particles.push(new Particle(0, Math.random() * h));

    // RIGHT
    particles.push(new Particle(w, Math.random() * h));
  }
}

// 🎬 LOOP
function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  createBorderFire();

  particles.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.life <= 0) particles.splice(i, 1);
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
