<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultra Realistic Candle</title>
<style>
  body {
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at center, #111, #000);
    overflow:hidden;
  }

  .scene {
    position:relative;
  }

  .candle {
    position:relative;
    width:60px;
    height:180px;
    background:linear-gradient(#fff,#eee);
    border-radius:12px;
    overflow:hidden;
    margin:auto;
  }

  .wax {
    position:absolute;
    bottom:0;
    width:100%;
    height:100%;
    background:linear-gradient(#fff,#ddd);
  }

  .wick {
    position:absolute;
    top:-20px;
    left:50%;
    width:4px;
    height:20px;
    background:black;
    transform:translateX(-50%);
  }

  .flame {
    position:absolute;
    top:-65px;
    left:50%;
    width:25px;
    height:50px;
    background:radial-gradient(circle, #fff 10%, yellow 40%, orange 70%, transparent 80%);
    border-radius:50%;
    transform:translateX(-50%);
    animation:flicker 0.12s infinite;
    filter:blur(0.6px);
  }

  .glow {
    position:absolute;
    top:-90px;
    left:50%;
    width:120px;
    height:120px;
    background:radial-gradient(circle, rgba(255,200,0,0.5), transparent 70%);
    transform:translateX(-50%);
    filter:blur(20px);
  }

  .shadow {
    position:absolute;
    bottom:-20px;
    left:50%;
    width:100px;
    height:20px;
    background:rgba(0,0,0,0.6);
    border-radius:50%;
    transform:translateX(-50%);
    filter:blur(10px);
  }

  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.15); }
    100% { transform: translateX(-50%) scale(1); }
  }

  .drip {
    position:absolute;
    width:10px;
    height:20px;
    background:#eee;
    border-radius:50%;
    opacity:0.9;
    animation: dripFall linear forwards;
  }

  @keyframes dripFall {
    from { transform: translateY(0); opacity:1; }
    to { transform: translateY(140px); opacity:0; }
  }

</style>
</head>
<body>

<div class="scene">
  <div class="candle" id="candle">
    <div class="wax" id="wax"></div>
    <div class="wick"></div>
    <div class="glow"></div>
    <div class="flame" id="flame"></div>
  </div>
  <div class="shadow"></div>
</div>

<script>
const wax = document.getElementById("wax");
const flame = document.getElementById("flame");
const candle = document.getElementById("candle");

let totalTime = 600; // 10 mins
let current = totalTime;

function melt(){
  if(current <= 0){
    flame.style.display = "none";
    return;
  }

  current--;

  let percent = current / totalTime;
  wax.style.height = (percent * 100) + "%";

  // Drip intensity increases in middle
  let stage = 1 - percent;
  if(Math.random() < stage){
    createDrip(stage);
  }

  setTimeout(melt, 1000);
}

function createDrip(stage){
  const drip = document.createElement("div");
  drip.className = "drip";

  drip.style.left = Math.random()*50 + "%";
  drip.style.top = "20px";

  let speed = 2 - stage; // faster later
  drip.style.animationDuration = speed + "s";

  candle.appendChild(drip);

  setTimeout(()=>drip.remove(), 3000);
}

// Motion tilt (wind simulation)
window.addEventListener('devicemotion', (e)=>{
  let x = e.accelerationIncludingGravity.x;
  flame.style.transform = `translateX(-50%) rotate(${x*5}deg)`;
});

// Mic blow detection
navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const mic = audioContext.createMediaStreamSource(stream);
  const analyser = audioContext.createAnalyser();

  mic.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);

  function detectBlow(){
    analyser.getByteFrequencyData(data);
    let volume = data.reduce((a,b)=>a+b)/data.length;

    if(volume > 60){
      flame.style.display = "none";
    }

    requestAnimationFrame(detectBlow);
  }

  detectBlow();
});

melt();
</script>

</body>
</html>
