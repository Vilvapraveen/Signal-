<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Train Signal System</title>

<style>
body {
  margin: 0;
  background: linear-gradient(#0f2027, #000);
  height: 100vh;
  overflow: hidden;
  perspective: 1000px;
}

/* Scene */
.scene {
  position: relative;
  width: 100%;
  height: 100%;
  transform: rotateX(60deg);
}

/* Track */
.track {
  position: absolute;
  width: 200%;
  height: 10px;
  background: #444;
  top: 50%;
  left: -50%;
  box-shadow: 0 0 20px #000;
}

/* Train */
.train {
  position: absolute;
  width: 120px;
  height: 40px;
  background: red;
  border-radius: 5px;
  top: calc(50% - 20px);
  left: -150px;
  box-shadow: 0 0 20px red;
}

/* 3 trains different colors */
.train2 { background: blue; box-shadow: 0 0 20px blue; top: calc(50% + 60px); }
.train3 { background: green; box-shadow: 0 0 20px green; top: calc(50% - 100px); }

/* Signal */
.signal {
  position: absolute;
  right: 100px;
  top: 30%;
  width: 60px;
  background: #111;
  padding: 10px;
  border-radius: 10px;
}

.light {
  width: 40px;
  height: 40px;
  margin: 10px auto;
  border-radius: 50%;
  background: #333;
}

.red.active { background: red; box-shadow: 0 0 20px red; }
.green.active { background: lime; box-shadow: 0 0 20px lime; }

/* Gate */
.gate {
  position: absolute;
  width: 200px;
  height: 10px;
  background: white;
  top: 60%;
  right: 150px;
  transform-origin: left;
  transition: 1s;
}

.down { transform: rotate(0deg); }
.up { transform: rotate(-70deg); }

</style>
</head>

<body>

<div class="scene">

  <div class="track"></div>

  <div id="train1" class="train"></div>
  <div id="train2" class="train train2"></div>
  <div id="train3" class="train train3"></div>

  <div class="signal">
    <div id="red" class="light red"></div>
    <div id="green" class="light green"></div>
  </div>

  <div id="gate" class="gate up"></div>

</div>

<script>

const red = document.getElementById("red");
const green = document.getElementById("green");
const gate = document.getElementById("gate");

const trains = [
  document.getElementById("train1"),
  document.getElementById("train2"),
  document.getElementById("train3")
];

let currentTrain = 0;

/* Signal Control */
function setSignal(isTrainComing) {
  red.classList.remove("active");
  green.classList.remove("active");

  if (isTrainComing) {
    red.classList.add("active");
    gate.classList.remove("up");
    gate.classList.add("down");
  } else {
    green.classList.add("active");
    gate.classList.remove("down");
    gate.classList.add("up");
  }
}

/* Move Train */
function moveTrain(train) {
  train.style.transition = "left 5s linear";
  train.style.left = "120%";

  setTimeout(() => {
    train.style.transition = "none";
    train.style.left = "-150px";
  }, 5000);
}

/* Loop system */
function runSystem() {

  if (currentTrain >= trains.length) currentTrain = 0;

  setSignal(true);

  setTimeout(() => {
    moveTrain(trains[currentTrain]);
  }, 1000);

  setTimeout(() => {
    setSignal(false);
  }, 6000);

  currentTrain++;

  setTimeout(runSystem, 8000);
}

runSystem();

</script>

</body>
</html>
