<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Traffic Signal</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    display: flex;
    gap: 50px;
    align-items: center;
  }

  /* Signal Box */
  .signal {
    background: rgba(0, 0, 0, 0.6);
    padding: 25px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }

  .light {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 20px auto;
    background: #222;
    transition: all 0.4s ease;
    position: relative;
  }

  .light::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    opacity: 0;
    transition: 0.4s;
  }

  .red.active {
    background: #ff2e2e;
    box-shadow: 0 0 40px #ff2e2e;
  }

  .yellow.active {
    background: #ffd000;
    box-shadow: 0 0 40px #ffd000;
  }

  .green.active {
    background: #00ff95;
    box-shadow: 0 0 40px #00ff95;
  }

  /* Panel */
  .panel {
    color: white;
    text-align: center;
  }

  .panel h1 {
    margin-bottom: 20px;
    font-size: 28px;
  }

  .timer {
    font-size: 50px;
    margin: 20px 0;
    font-weight: bold;
  }

  .status {
    font-size: 20px;
    margin-bottom: 20px;
  }

  button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .start { background: #00c853; color: white; }
  .stop { background: #d50000; color: white; }
  .reset { background: #2962ff; color: white; }

  button:hover {
    transform: scale(1.1);
  }

</style>
</head>

<body>

<div class="container">

  <!-- Signal -->
  <div class="signal">
    <div id="red" class="light red"></div>
    <div id="yellow" class="light yellow"></div>
    <div id="green" class="light green"></div>
  </div>

  <!-- Control Panel -->
  <div class="panel">
    <h1>Traffic Control</h1>
    <div class="timer" id="timer">10</div>
    <div class="status" id="status">STOP</div>

    <button class="start" onclick="start()">Start</button>
    <button class="stop" onclick="stop()">Stop</button>
    <button class="reset" onclick="reset()">Reset</button>
  </div>

</div>

<script>
  const red = document.getElementById("red");
  const yellow = document.getElementById("yellow");
  const green = document.getElementById("green");

  const timerDisplay = document.getElementById("timer");
  const statusDisplay = document.getElementById("status");

  let state = 0;
  let timer = 10;
  let interval;
  let running = false;

  function updateUI() {
    red.classList.remove("active");
    yellow.classList.remove("active");
    green.classList.remove("active");

    if (state === 0) {
      red.classList.add("active");
      statusDisplay.innerText = "STOP";
    } else if (state === 1) {
      yellow.classList.add("active");
      statusDisplay.innerText = "READY";
    } else {
      green.classList.add("active");
      statusDisplay.innerText = "GO";
    }
  }

  function nextState() {
    if (state === 0) {
      state = 1;
      timer = 5;
    } else if (state === 1) {
      state = 2;
      timer = 10;
    } else {
      state = 0;
      timer = 10;
    }
    updateUI();
  }

  function start() {
    if (running) return;
    running = true;

    updateUI();
    timerDisplay.innerText = timer;

    interval = setInterval(() => {
      timer--;
      timerDisplay.innerText = timer;

      if (timer === 0) {
        nextState();
      }
    }, 1000);
  }

  function stop() {
    clearInterval(interval);
    running = false;
  }

  function reset() {
    stop();
    state = 0;
    timer = 10;
    timerDisplay.innerText = timer;
    statusDisplay.innerText = "STOP";
    updateUI();
  }

  // Initial load
  updateUI();
</script>

</body>
</html>
