<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real Candle PRO</title>
<style>
body{margin:0;height:100vh;background:#000;display:flex;align-items:center;justify-content:center;font-family:sans-serif}
.scene{position:relative}
.candle{position:relative;width:80px;height:220px;background:linear-gradient(#fff,#ddd);border-radius:16px;overflow:hidden}
.waxTop{position:absolute;top:0;width:100%;height:100%;background:linear-gradient(#fff,#eee);transition:height 1s linear}
.wick{position:absolute;top:-18px;left:50%;width:4px;height:18px;background:#000;transform:translateX(-50%)}
.flame{position:absolute;top:-80px;left:50%;width:30px;height:60px;transform:translateX(-50%);
background:radial-gradient(circle at 50% 20%, #fff 0%, #ffe066 25%, #ff9f1c 55%, rgba(255,0,0,0.2) 75%, transparent 85%);
border-radius:50%;animation:flicker .1s infinite}
.glow{position:absolute;top:-110px;left:50%;width:180px;height:180px;transform:translateX(-50%);
background:radial-gradient(circle, rgba(255,180,0,.6), transparent 70%);filter:blur(25px)}
.shadow{position:absolute;bottom:-20px;left:50%;width:140px;height:30px;transform:translateX(-50%);
background:rgba(0,0,0,.8);border-radius:50%;filter:blur(15px)}
@keyframes flicker{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.2)}100%{transform:translateX(-50%) scale(1)}}
.drip{position:absolute;width:12px;height:22px;background:#eee;border-radius:50%;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(170px);opacity:0}}
.controls{position:fixed;bottom:20px;display:flex;gap:10px}
button{padding:10px 15px;border:none;border-radius:10px;background:#ff9800;color:#000;font-weight:bold}
</style>
</head>
<body>

<div class="scene">
  <div class="candle" id="candle">
    <div class="waxTop" id="wax"></div>
    <div class="wick"></div>
    <div class="glow"></div>
    <div class="flame" id="flame"></div>
  </div>
  <div class="shadow"></div>
</div>

<div class="controls">
  <button onclick="start()">Start 🔥</button>
  <button onclick="blow()">Blow 💨</button>
  <button onclick="reset()">Reset 🔁</button>
</div>

<script>
const wax=document.getElementById('wax');
const flame=document.getElementById('flame');
const candle=document.getElementById('candle');

let total=600; // 10 min
let t=total;
let running=false;

function start(){ if(!running){ running=true; loop(); }}

function loop(){
  if(!running) return;
  if(t<=0){ flame.style.display='none'; return; }

  t--;
  let p=t/total;
  wax.style.height=(p*100)+'%';

  // realistic drip stages
  let stage=1-p;
  if(Math.random()<stage){ createDrip(stage); }

  // flame shrink near end
  flame.style.transform=`translateX(-50%) scale(${0.8+ p*0.4})`;

  setTimeout(loop,1000);
}

function createDrip(stage){
  let d=document.createElement('div');
  d.className='drip';
  d.style.left=(Math.random()*60+10)+'%';
  d.style.top='20px';
  d.style.animationDuration=(2-stage)+'s';
  candle.appendChild(d);
  setTimeout(()=>d.remove(),2500);
}

function blow(){
  flame.style.display='none';
}

function reset(){
  t=total;
  running=false;
  wax.style.height='100%';
  flame.style.display='block';
}
</script>

</body>
</html>
