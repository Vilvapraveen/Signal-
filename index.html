<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Candle Animation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .candle {
      position: relative;
      width: 60px;
      height: 150px;
      background: linear-gradient(#fff, #ddd);
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .wick {
      position: absolute;
      top: -20px;
      left: 50%;
      width: 4px;
      height: 20px;
      background: black;
      transform: translateX(-50%);
    }

    .flame {
      position: absolute;
      top: -60px;
      left: 50%;
      width: 20px;
      height: 40px;
      background: radial-gradient(circle, yellow 0%, orange 60%, transparent 70%);
      border-radius: 50% 50% 50% 50%;
      transform: translateX(-50%);
      animation: flicker 0.2s infinite;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); opacity: 1; }
      50% { transform: translateX(-50%) scale(1.1); opacity: 0.8; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }

  </style>
</head>
<body>

  <div class="candle">
    <div class="wick"></div>
    <div class="flame"></div>
  </div>

</body>
</html>
