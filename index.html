<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Candle Motion Flame</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .candle {
      position: relative;
      width: 60px;
      height: 150px;
      background: linear-gradient(#fff, #ddd);
      border-radius: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .wick {
      position: absolute;
      top: -20px;
      left: 50%;
      width: 4px;
      height: 20px;
      background: black;
      transform: translateX(-50%);
    }

    .flame {
      position: absolute;
      top: -60px;
      left: 50%;
      width: 20px;
      height: 40px;
      background: radial-gradient(circle, yellow 0%, orange 60%, transparent 70%);
      border-radius: 50%;
      transform: translateX(-50%);
      transition: transform 0.1s;
    }

    .off {
      opacity: 0;
    }

    button {
      position: absolute;
      bottom: 20px;
      padding: 10px 20px;
      border: none;
      background: orange;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="candle">
    <div class="wick"></div>
    <div class="flame" id="flame"></div>
  </div>

  <button onclick="enableMotion()">Enable Motion</button>

  <script>
    const flame = document.getElementById("flame");

    function enableMotion() {
      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              startMotion();
            }
          })
          .catch(console.error);
      } else {
        startMotion();
      }
    }

    function startMotion() {
      window.addEventListener('devicemotion', (event) => {
        const x = event.accelerationIncludingGravity.x;
        const y = event.accelerationIncludingGravity.y;

        // Flame tilt effect
        flame.style.transform = `translateX(-50%) rotate(${x * 5}deg) scale(${1 + Math.abs(y) * 0.02})`;

        // Blow out condition (shake hard)
        if (Math.abs(x) > 8 || Math.abs(y) > 12) {
          flame.classList.add("off");
        }
      });
    }
  </script>

</body>
</html>
