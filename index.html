<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Railway Game V2</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  color:white;
  font-family:sans-serif;
}

/* HUD */
.hud {
  position:absolute;
  top:10px;
  left:10px;
  font-size:18px;
}

/* SCENE */
.scene {
  width:100%;
  height:100vh;
  transform:rotateX(65deg);
}

/* TRACK */
.track {
  position:absolute;
  width:300%;
  height:12px;
  background:#555;
  top:50%;
  left:-100%;
}

/* TRAIN */
.train {
  position:absolute;
  width:200px;
  height:50px;
  background:red;
  top:50%;
  left:-300px;
}

/* ROAD */
.road {
  position:absolute;
  bottom:0;
  width:100%;
  height:120px;
  background:#222;
}

/* CAR */
.car {
  position:absolute;
  width:60px;
  height:30px;
  background:yellow;
  bottom:40px;
  left:50px;
}

/* SIGNAL */
.signal {
  position:absolute;
  right:120px;
  top:30%;
}

.light {
  width:40px;
  height:40px;
  border-radius:50%;
  margin:10px;
  background:#333;
}

.red.active { background:red; }
.green.active { background:lime; }

/* GATE */
.gate {
  position:absolute;
  width:220px;
  height:10px;
  background:white;
  top:60%;
  right:180px;
  transform-origin:left;
  transition:0.5s;
}
.up { transform:rotate(-75deg); }
.down { transform:rotate(0deg); }

/* GAME OVER */
.gameover {
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  font-size:40px;
  display:none;
}

</style>
</head>

<body>

<div class="hud">
  Score: <span id="score">0</span> |
  Lives: <span id="lives">3</span>
</div>

<div class="scene">

  <div class="track"></div>

  <div id="train" class="train"></div>

  <div class="signal">
    <div id="red" class="light red"></div>
    <div id="green" class="light green"></div>
  </div>

  <div id="gate" class="gate up"></div>

  <div class="road">
    <div id="car" class="car"></div>
  </div>

  <div id="gameover" class="gameover">
    GAME OVER <br>
    Press SPACE to Restart
  </div>

</div>

<script>

const train = document.getElementById("train");
const car = document.getElementById("car");
const red = document.getElementById("red");
const green = document.getElementById("green");
const gate = document.getElementById("gate");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const gameover = document.getElementById("gameover");

let carX = 50;
let moving = false;
let gameRunning = true;

let score = 0;
let lives = 3;
let speed = 5000;

/* CONTROL */
document.addEventListener("keydown", (e)=>{
  if(!gameRunning){
    if(e.code === "Space") restart();
    return;
  }

  if(e.key === "ArrowUp") moving = true;
  if(e.key === "ArrowDown") moving = false;
});

/* CAR LOOP */
function updateCar(){
  if(moving) carX += 2;
  car.style.left = carX + "px";

  checkCollision();
  requestAnimationFrame(updateCar);
}

/* TRAIN */
function moveTrain(){
  setSignal(true);

  train.style.transition=`left ${speed/1000}s linear`;
  train.style.left="120%";

  setTimeout(()=>{
    train.style.transition="none";
    train.style.left="-300px";
    setSignal(false);

    score++;
    scoreEl.innerText = score;

    speed *= 0.95; // increase difficulty

  },speed);
}

/* SIGNAL */
function setSignal(trainComing){
  red.classList.toggle("active", trainComing);
  green.classList.toggle("active", !trainComing);

  gate.classList.toggle("down", trainComing);
  gate.classList.toggle("up", !trainComing);
}

/* COLLISION */
function checkCollision(){
  let t = train.getBoundingClientRect();
  let c = car.getBoundingClientRect();

  if(c.right > t.left && c.left < t.right &&
     c.bottom > t.top && c.top < t.bottom){
    loseLife();
  }
}

/* LIFE */
function loseLife(){
  lives--;
  livesEl.innerText = lives;

  carX = 50;

  if(lives <= 0){
    endGame();
  }
}

/* END */
function endGame(){
  gameRunning = false;
  gameover.style.display = "block";
}

/* RESTART */
function restart(){
  score = 0;
  lives = 3;
  speed = 5000;
  gameRunning = true;

  scoreEl.innerText = score;
  livesEl.innerText = lives;
  gameover.style.display = "none";
}

/* LOOP */
function loop(){
  if(!gameRunning) return;

  moveTrain();

  setTimeout(loop, speed + 1000);
}

updateCar();
loop();

</script>

</body>
</html>
