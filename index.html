<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Traffic Signal</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    height: 100vh;
    background: radial-gradient(circle at top, #0f2027, #203a43, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
  }

  .container {
    display: flex;
    gap: 80px;
    align-items: center;
  }

  /* 3D Signal Box */
  .signal {
    transform: rotateX(10deg) rotateY(-10deg);
    background: linear-gradient(145deg, #111, #000);
    padding: 30px;
    border-radius: 25px;
    box-shadow: 
      20px 20px 40px #000,
      -10px -10px 30px #222,
      inset 0 0 20px #000;
  }

  .light {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 25px auto;
    background: radial-gradient(circle, #222, #000);
    box-shadow: inset 0 0 15px #000;
    transition: all 0.5s ease;
    position: relative;
  }

  /* Glow + depth */
  .light.active::before {
    content: "";
    position: absolute;
    width: 140%;
    height: 140%;
    top: -20%;
    left: -20%;
    border-radius: 50%;
    filter: blur(20px);
    opacity: 0.7;
  }

  .red.active {
    background: radial-gradient(circle, #ff4d4d, #7a0000);
    box-shadow: 0 0 50px #ff0000, inset 0 0 20px #000;
  }

  .red.active::before {
    background: red;
  }

  .yellow.active {
    background: radial-gradient(circle, #ffe066, #996c00);
    box-shadow: 0 0 50px #ffd000, inset 0 0 20px #000;
  }

  .yellow.active::before {
    background: yellow;
  }

  .green.active {
    background: radial-gradient(circle, #00ffb3, #006644);
    box-shadow: 0 0 50px #00ff95, inset 0 0 20px #000;
  }

  .green.active::before {
    background: #00ff95;
  }

  /* Panel */
  .panel {
    text-align: center;
    color: white;
  }

  .panel h1 {
    margin-bottom: 20px;
    font-size: 30px;
  }

  .timer {
    font-size: 70px;
    margin: 20px 0;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
  }

  .status {
    font-size: 22px;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }

  button {
    padding: 12px 22px;
    margin: 6px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .start { background: #00c853; color: white; }
  .stop { background: #d50000; color: white; }
  .reset { background: #2962ff; color: white; }

  button:hover {
    transform: scale(1.15);
  }

</style>
</head>

<body>

<div class="container">

  <!-- Signal -->
  <div class="signal">
    <div id="red" class="light red"></div>
    <div id="yellow" class="light yellow"></div>
    <div id="green" class="light green"></div>
  </div>

  <!-- Panel -->
  <div class="panel">
    <h1>3D Traffic Control</h1>
    <div class="timer" id="timer">10</div>
    <div class="status" id="status">STOP</div>

    <button class="start" onclick="start()">Start</button>
    <button class="stop" onclick="stop()">Stop</button>
    <button class="reset" onclick="reset()">Reset</button>
  </div>

</div>

<script>
  const red = document.getElementById("red");
  const yellow = document.getElementById("yellow");
  const green = document.getElementById("green");

  const timerDisplay = document.getElementById("timer");
  const statusDisplay = document.getElementById("status");

  let state = 0;
  let timer = 10;
  let interval;
  let running = false;

  function updateUI() {
    red.classList.remove("active");
    yellow.classList.remove("active");
    green.classList.remove("active");

    if (state === 0) {
      red.classList.add("active");
      statusDisplay.innerText = "STOP";
    } else if (state === 1) {
      yellow.classList.add("active");
      statusDisplay.innerText = "READY";
    } else {
      green.classList.add("active");
      statusDisplay.innerText = "GO";
    }
  }

  function nextState() {
    if (state === 0) {
      state = 1;
      timer = 5;
    } else if (state === 1) {
      state = 2;
      timer = 10;
    } else {
      state = 0;
      timer = 10;
    }
    updateUI();
  }

  function start() {
    if (running) return;
    running = true;

    updateUI();
    timerDisplay.innerText = timer;

    interval = setInterval(() => {
      timer--;
      timerDisplay.innerText = timer;

      if (timer === 0) {
        nextState();
      }
    }, 1000);
  }

  function stop() {
    clearInterval(interval);
    running = false;
  }

  function reset() {
    stop();
    state = 0;
    timer = 10;
    timerDisplay.innerText = timer;
    statusDisplay.innerText = "STOP";
    updateUI();
  }

  updateUI();
</script>

</body>
</html>
