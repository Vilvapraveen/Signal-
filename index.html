<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Train Game PRO</title>

<style>
body {
  margin:0;
  background:#0a0a0a;
  overflow:hidden;
  font-family:sans-serif;
  color:white;
}

/* HUD */
.hud {
  position:absolute;
  top:10px;
  left:10px;
  font-size:18px;
}

/* GAME OVER UI */
.gameover {
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  font-size:40px;
  display:none;
}

/* BUTTON */
button {
  padding:10px 20px;
  margin-top:20px;
  font-size:18px;
  cursor:pointer;
}

/* CITY */
.city-bg {
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(#111, #000);
}

/* BUILDINGS */
.building {
  position:absolute;
  bottom:120px;
  width:60px;
  background:#222;
}

.b1 { height:150px; left:10%; }
.b2 { height:200px; left:25%; }
.b3 { height:180px; left:50%; }
.b4 { height:220px; left:75%; }

/* TRACK */
.track {
  position:absolute;
  width:100%;
  height:6px;
  background:#555;
}

.t1 { top:35%; }
.t2 { top:50%; }
.t3 { top:65%; }

/* STATION */
.station {
  position:absolute;
  width:30px;
  height:30px;
  background:#00e5ff;
  border-radius:50%;
  top:-12px;
}

/* TRAIN */
.train {
  position:absolute;
  width:70px;
  height:25px;
  border-radius:4px;
}

.red { background:red; }
.blue { background:blue; }
.green { background:lime; }

/* SIGNAL */
.signal {
  position:absolute;
  right:50px;
  top:20px;
}

.light {
  width:30px;
  height:30px;
  border-radius:50%;
  margin:5px;
  background:#333;
}

.active.red { background:red; }
.active.green { background:lime; }

</style>
</head>

<body>

<div class="city-bg"></div>

<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>

<div class="hud">
  Score: <span id="score">0</span> |
  Level: <span id="level">1</span>
</div>

<div class="gameover" id="gameover">
  💥 GAME OVER <br>
  <button onclick="restart()">Restart</button>
</div>

<div class="signal">
  <div id="red" class="light red"></div>
  <div id="green" class="light green active"></div>
</div>

<div class="track t1" id="track1"></div>
<div class="track t2" id="track2"></div>
<div class="track t3" id="track3"></div>

<script>

/* SOUND */
const crashSound = new Audio("https://www.soundjay.com/mechanical/sounds/crash-01.mp3");

/* ELEMENTS */
const tracks = [
  document.getElementById("track1"),
  document.getElementById("track2"),
  document.getElementById("track3")
];

const red = document.getElementById("red");
const green = document.getElementById("green");
const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");
const gameoverUI = document.getElementById("gameover");

let signalStop = false;
let score = 0;
let level = 1;
let gameRunning = true;

/* STATIONS */
const stations = [20,40,60,80];

/* CREATE STATIONS */
tracks.forEach(track=>{
  stations.forEach(pos=>{
    const s = document.createElement("div");
    s.className="station";
    s.style.left=pos+"%";
    track.appendChild(s);
  });
});

/* TRAINS */
const trains = [];

tracks.forEach((track,i)=>{
  const t = document.createElement("div");
  t.className="train " + ["red","blue","green"][i];
  track.appendChild(t);

  trains.push({
    el:t,
    x:0,
    speed:0.2 + i*0.1,
    wait:false
  });
});

/* SIGNAL CONTROL */
document.addEventListener("keydown", e=>{
  if(e.code==="Space"){
    signalStop = !signalStop;
    red.classList.toggle("active", signalStop);
    green.classList.toggle("active", !signalStop);
  }
});

/* COLLISION */
function checkCollision(){
  for(let i=0;i<trains.length;i++){
    for(let j=i+1;j<trains.length;j++){
      if(Math.abs(trains[i].x - trains[j].x) < 5){
        endGame();
      }
    }
  }
}

/* GAME OVER */
function endGame(){
  gameRunning = false;
  crashSound.play();
  gameoverUI.style.display = "block";
}

/* RESTART */
function restart(){
  location.reload();
}

/* LOOP */
function loop(){

  if(!gameRunning) return;

  trains.forEach(train=>{

    if(signalStop) return;

    if(!train.wait){
      train.x += train.speed;
      train.el.style.left = train.x + "%";
    }

    stations.forEach(pos=>{
      if(Math.abs(train.x - pos) < 1 && !train.wait){
        train.wait = true;

        setTimeout(()=>{
          train.wait = false;

          score++;
          scoreEl.innerText = score;

          /* LEVEL UP */
          if(score % 10 === 0){
            level++;
            levelEl.innerText = level;

            trains.forEach(t=> t.speed += 0.05);
          }

        },1000);
      }
    });

    if(train.x > 100) train.x = 0;

  });

  checkCollision();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
